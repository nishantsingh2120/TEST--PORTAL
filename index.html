<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header / Navbar -->
    <header>
        <div class="brand-logo">Portal App</div>
        <nav>
            <button class="btn btn-outline" onclick="showPage('login-page')">Login</button>
            <button class="btn btn-outline" onclick="showPage('dashboard-page')">Dashboard</button>
        </nav>
    </header>

    <main class="container">
        
        <!-- LOGIN PAGE VIEW -->
        <section id="login-page" class="login-container">
            <div class="card">
                <h2>Portal Login</h2>
                <form id="loginForm" onsubmit="handleLogin(event)">
                    
                    <div class="form-group">
                        <label for="userRole">Select Login Type</label>
                        <select id="userRole" required>
                            <option value="admin">Admin Login</option>
                            <option value="candidate">Candidate Login</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="username">Username / Candidate ID</label>
                        <input type="text" id="username" placeholder="Enter ID" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Enter password" required>
                    </div>

                    <button type="submit" class="btn btn-primary">Login Now</button>
                </form>
            </div>
        </section>

        <!-- DASHBOARD PAGE VIEW -->
        <section id="dashboard-page" class="hidden">
            <div class="card">
                <h2>Dashboard Overview</h2>
                <p>Welcome to the Portal! Share your link with candidates below.</p>
                <br>

                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>Total Candidates</h3>
                        <p>128</p>
                    </div>
                    <div class="stat-card">
                        <h3>Active Tests</h3>
                        <p>14</p>
                    </div>
                </div>

                <!-- Copy Link Section -->
                <div class="form-group" style="align-items: center; width: 100%;">
                    <label>Share Candidate Registration Link</label>
                    <button class="btn btn-primary" onclick="copyLink('https://yourportal.com/candidate-register')">
                        📋 Copy Candidate Link
                    </button>
                </div>
            </div>
        </section>

    </main>

    <!-- Toast Notification Popup -->
    <div id="copyToast" class="toast-notification hidden">
        ✨ Link successfully copied to clipboard!
    </div>

    <script src="script.js"></script>
</body>
</html>
