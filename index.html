<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <div class="brand-logo">Portal App</div>
        <nav class="nav-links">
            <button class="btn btn-outline nav-btn" id="nav-login" onclick="showPage('login-page')">Login</button>
            <button class="btn btn-outline nav-btn" id="nav-dash" onclick="openDashboard()">Dashboard</button>
        </nav>
    </header>

    <main class="container">
        
        <!-- LOGIN PAGE VIEW -->
        <section id="login-page" class="login-container">
            <div class="card">
                <h2>Portal Login</h2>
                <form id="loginForm" onsubmit="handleLogin(event)">
                    
                    <div class="form-group">
                        <label for="userRole">Select Login Type</label>
                        <select id="userRole" required>
                            <option value="admin">Admin Login</option>
                            <option value="candidate">Candidate Login</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="username">Username / ID</label>
                        <input type="text" id="username" placeholder="Enter ID" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Enter password" required>
                    </div>

                    <button type="submit" class="btn btn-primary">Login Now</button>
                </form>
            </div>
        </section>

        <!-- DASHBOARD PAGE VIEW -->
        <section id="dashboard-page" class="hidden" style="width: 100%;">
            
            <!-- Dashboard Overview Card -->
            <div class="card">
                <h2>Dashboard Overview</h2>
                <p id="welcome-text">Welcome back!</p>
                <br>

                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>Active Candidates</h3>
                        <p id="stat-candidates" style="font-size: 2rem; font-weight: bold; color: #818cf8;">0</p>
                    </div>
                    <div class="stat-card">
                        <h3>Active Tests</h3>
                        <p id="stat-tests" style="font-size: 2rem; font-weight: bold; color: #818cf8;">0</p>
                    </div>
                </div>

                <div class="form-group" style="align-items: center; width: 100%;">
                    <label>Share Candidate Registration Link</label>
                    <button class="btn btn-primary" onclick="copyLink('https://yourportal.com/candidate-register')">
                        📋 Copy Candidate Link
                    </button>
                </div>
                
                <br>
                <button class="btn btn-outline" style="border-color: #ef4444; color: #ef4444;" onclick="handleLogout()">Logout</button>
            </div>

            <!-- ADMIN ONLY: CREATE TEST SECTION -->
            <div id="admin-test-section" class="card hidden">
                <h2>Set & Create New Test</h2>
                <form id="createTestForm" onsubmit="handleCreateTest(event)">
                    <div class="form-group">
                        <label for="testTitle">Test Title</label>
                        <input type="text" id="testTitle" placeholder="e.g. Mathematics Final Exam" required>
                    </div>

                    <div class="form-group">
                        <label for="testDuration">Duration (in minutes)</label>
                        <input type="number" id="testDuration" placeholder="e.g. 60" required>
                    </div>

                    <button type="submit" class="btn btn-primary">Publish Test</button>
                </form>

                <br>
                <h3 style="text-align: left; margin-bottom: 12px;">Active Test List</h3>
                <div id="test-list-container">
                    <!-- Dynamic Tests Inserted Here -->
                </div>
            </div>

            <!-- CANDIDATES DIRECTORY TABLE -->
            <div id="candidates-directory-section" class="card hidden">
                <h2 style="text-align: left;">Candidate Directory</h2>
                <div style="overflow-x: auto; width: 100%;">
                    <table style="width: 100%; border-collapse: collapse; margin-top: 15px; text-align: left;">
                        <thead>
                            <tr style="border-bottom: 1px solid rgba(255,255,255,0.2); color: #818cf8;">
                                <th style="padding: 10px;">ID</th>
                                <th style="padding: 10px;">Candidate Name</th>
                                <th style="padding: 10px;">Status</th>
                            </tr>
                        </thead>
                        <tbody id="candidate-table-body">
                            <!-- Dynamic Candidate Rows -->
                        </tbody>
                    </table>
                </div>
            </div>

        </section>

    </main>

    <!-- Toast Notification Popup -->
    <div id="copyToast" class="toast-notification hidden">
        ✨ Notification
    </div>

    <script src="script.js"></script>
</body>
</html>
